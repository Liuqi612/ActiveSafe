    optional double init_entry_func_path_alpha = 21;
    optional double init_entry_func_theta_alpha = 22;
    optional double init_entry_func_path_inflection_step = 23;
    optional double init_entry_func_theta_inflection_step = 24;
    optional double lane_evasion_gain = 25;
    optional double lane_evasion_ramp_out_gain = 26;
